<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Me</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa+Ink:wght@700&family=Poppins:wght@200&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/nav.css">
    <link rel="icon" type="image/png" sizes="96x96" href="favicon-96x96.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
</head>
<body>
    <header>
        <nav class="navbar">
            <div class="logo">
                <img src="img/AM Logo.svg" alt="My initials as a logo">
                <h1>Contact Me</h1>
            </div>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="Coding-Projects.html">Coding Projects</a></li>
                <li><a href="Animations.html">Animations</a></li>
                <li><a href="Contact.html">Contact</a></li>
            </ul>
        </nav>
    </header>
    
    <main>
        <section class="contact-section">
            <h2>Get in Touch</h2>
            <p class="contact-intro">Feel free to reach out to me for any opportunities, questions, or just to say hello!</p>
            
            <form id="contactForm">
                <div class="form-group">
                    <label for="name">Name</label>
                    <input type="text" id="name" name="name" placeholder="John Doe" required>
                </div>

                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" placeholder="john.doe@example.com" required>
                </div>

                <div class="form-group">
                    <label for="message">Message</label>
                    <textarea id="message" name="message" rows="5" placeholder="Hi Adam, I'd like to get in touch about..."></textarea>
                </div>

                <button type="submit">Send Message</button>
            </form>
        </section>
    </main>

    <footer>
        <div class="social-links">
            <a href="https://github.com/Adam-Millman" target="_blank" rel="noopener noreferrer">
                <img src="img/icons/github.svg" alt="GitHub" class="social-icon">
            </a>
            <a href="https://www.linkedin.com/in/adam-n-millman/" target="_blank" rel="noopener noreferrer">
                <img src="img/icons/linkedin.svg" alt="LinkedIn" class="social-icon">
            </a>
        </div>
        <p>&copy; 2025 Adam Millman</p>
        <p>amillman20@gmail.com</p>
    </footer>
    <script src="js/contact.js"></script>
</body>
</html>
